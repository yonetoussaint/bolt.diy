# Netlify deployment configuration for bolt.diy
#
# Route every request through the Remix SSR function on the Node runtime
# (see netlify/functions/ssr.mjs). Cloudflare/Docker targets stay unchanged.
#
# Build outputs:
#   - build/client : static assets, published to Netlify's CDN
#   - build/server : Remix SSR bundle, imported by the SSR function

[build]
  command = "npm run netlify:build"
  publish = "build/client"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Vite/Rollup peaks well above Node's default heap (~25% of RAM, ~2 GB on
  # 8 GB runners) while rendering chunks of this large client bundle.
  # Without this override the build dies with:
  #   FATAL ERROR: ... JavaScript heap out of memory
  NODE_OPTIONS = "--max-old-space-size=8192"

# Ship the freshly generated SSR bundle inside the function package so the
# dynamic import in netlify/functions/ssr.mjs always resolves at runtime,
# independent of how the function bundler traces dependencies.
[functions]
  included_files = ["build/server/**"]

# Route every request through the Remix SSR function. With `force = false`,
# requests matching files that really exist in build/client (hashed assets,
# favicon.ico, manifest.webmanifest, ...) are still served directly from the
# CDN without invoking the function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200
  force = false

[dev]
  command = "npm run netlify:dev"
  port = 8787
  framework = "manual"
  targetPort = 5173
