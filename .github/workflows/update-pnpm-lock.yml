name: Update pnpm-lock.yaml
# Trigger touch: 2026-06-14T00:00:00Z

on:
  push:
    branches:
      - update-pnpm-lockfile
      - update-pnpm-lockfile-clean

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.14.4 --activate

      - name: Install dependencies and regenerate lockfile
        run: pnpm install --prefer-frozen-lockfile=false

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm-lock.yaml [ci skip]" || echo "No changes to commit"
          git push origin HEAD:update-pnpm-lockfile

      - name: Create pull request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update pnpm-lock.yaml [ci skip]"
          title: "chore: update pnpm-lock.yaml"
          body: |
            This PR updates `pnpm-lock.yaml` to match `package.json`.
            Workflow regenerated the lockfile and committed it to the branch.
          base: main
          branch: update-pnpm-lockfile
