name: Update pnpm-lock.yaml
# Trigger touch: 2026-06-14T00:00:00Z

on:
  push:
    branches:
      - update-pnpm-lockfile
      - update-pnpm-lockfile-clean

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.14.4 --activate

      - name: Install dependencies and regenerate lockfile
        run: pnpm install --prefer-frozen-lockfile=false

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm-lock.yaml [ci skip]" || echo "No changes to commit"
          git push origin HEAD:update-pnpm-lockfile

      - name: Create pull request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update pnpm-lock.yaml [ci skip]"
          title: "chore: update pnpm-lock.yaml"
          body: |
            This PR updates `pnpm-lock.yaml` to match `package.json`.
            Workflow regenerated the lockfile and committed it to the branch.
          base: main
          branch: update-pnpm-lockfile

      - name: Auto-merge pull request
        uses: actions/github-script@v7
        with:
          script: |
            const branch = 'update-pnpm-lockfile';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // find existing open PR for the branch
            const { data: prs } = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, state: 'open' });
            let pr = prs && prs[0];
            if (!pr) {
              const { data } = await github.rest.pulls.create({ owner, repo, title: 'chore: update pnpm-lock.yaml', head: branch, base: 'main', body: 'Automated lockfile update (CI)' });
              pr = data;
            }
            try {
              await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, commit_title: 'chore: update pnpm-lock.yaml', merge_method: 'merge' });
              core.info(`Merged PR #${pr.number}`);
            } catch (err) {
              core.info(`Could not merge PR #${pr.number}: ${err.message}`);
            }
